[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hookshot-workbench-mcp"
version = "0.1.0"
description = "Owned jobs and read-only observations for the Hookshot workbench"
requires-python = ">=3.12"
dependencies = ["fastmcp==4.1.3"]

[project.scripts]
hookshot-workbench = "src.main:main"
hookshot-wb = "src.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=1"]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
